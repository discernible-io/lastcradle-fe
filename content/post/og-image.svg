  <g transform="translate(664, 270)">
    <rect width="112" height="112" rx="12" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
    <g transform="translate(32, 28) scale(2)" fill="#000000">
      <path d="M12 6.5c3.79 0 7.17 2.13 8.82 5.5a9.86 9.86 0 0 1-2.24 3.16l1.43 1.43C21.95 14.87 23 12.8 23 12c0-5.52-5.05-10-11-10-1.78 0-3.47.41-4.99 1.14l1.57 1.57A9.1 9.1 0 0 1 12 6.5zM2.81 2.81 1.39 4.22l3.4 3.4A11.3 11.3 0 0 0 1 12c0 5.52 5.05 10 11 10 1.78 0 3.47-.41 4.99-1.14l3.79 3.79 1.41-1.41L2.81 2.81zM12 17.5c-3.79 0-7.17-2.13-8.82-5.5a9.77 9.77 0 0 1 3.4-3.93l1.58 1.58A3.5 3.5 0 0 0 12 15.5c.44 0 .86-.08 1.25-.23l1.53 1.53c-.87.45-1.84.7-2.78.7zm.5-6.79 2.29 2.29c.10-.32.21-.65.21-1 0-1.93-1.57-3.5-3.5-3.5-.35 0-.68.07-1 .2l1.54 1.54c.16-.02.32-.03.46-.03.55 0 1 .45 1 1 0 .14-.01.3-.03.46z"/>
    </g>
    <text class="label" x="56" y="138" text-anchor="middle">Espionage</text>
  </g>

  <!-- whiteHole · compute -->
  <g transform="translate(808, 270)">
    <rect width="112" height="112" rx="12" fill="#555555" fill-opacity="0.08" stroke="#555555" stroke-opacity="0.32" stroke-width="2"/>
    <g transform="translate(32, 28) scale(2)" fill="#555555">
