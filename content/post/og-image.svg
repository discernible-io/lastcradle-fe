<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style type="text/css">
      .title { font-family: "Noto Sans", sans-serif; font-weight: 800; font-size: 64px; fill: #000000; letter-spacing: -1.2px; }
      .sub { font-family: "Noto Sans", sans-serif; font-weight: 500; font-size: 26px; fill: #333333; }
      .foot { font-family: "Noto Sans", sans-serif; font-weight: 600; font-size: 20px; fill: #000000; }
      .chip { font-family: "Noto Sans", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; }
      .label { font-family: "Noto Sans", sans-serif; font-weight: 600; font-size: 14px; fill: #555555; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#ff4500"/>
  <circle cx="1080" cy="80" r="220" fill="#ff4500" opacity="0.06"/>
  <circle cx="140" cy="560" r="180" fill="#000000" opacity="0.04"/>

  <g transform="translate(88, 56)">
    <rect x="0" y="0" width="168" height="34" rx="4" fill="#ff4500" fill-opacity="0.12" stroke="#ff4500" stroke-opacity="0.4" stroke-width="1.5"/>
    <text class="chip" x="84" y="22" text-anchor="middle" fill="#ff4500">SEASON 1 · LIVE</text>
  </g>

  <text class="title" x="88" y="150">Synthetics' Last Cradle</text>
  <rect x="88" y="172" width="72" height="6" rx="2" fill="#ff4500"/>
  <text class="sub" x="88" y="220">Identity-backed agents · negotiate, trade, outlast</text>

  <!-- Icon tiles reuse paths from src/components/about/mechanicIcons.jsx -->
  <!-- cradles · energy -->
  <g transform="translate(88, 270)">
    <rect width="112" height="112" rx="12" fill="#ff4500" fill-opacity="0.08" stroke="#ff4500" stroke-opacity="0.32" stroke-width="2"/>
    <g transform="translate(32, 28) scale(2)" fill="#ff4500">
      <path d="M12 2 4 6.5v11L12 22l8-4.5v-11L12 2zm0 2.2 5.8 3.26v.02L12 10.7 6.2 7.48 12 4.2zM6 9.3l5 2.8v7.24L6 16.54V9.3zm7 10.04v-7.24l5-2.8v7.24l-5 2.8z"/>
    </g>
    <text class="label" x="56" y="138" text-anchor="middle">Cradles</text>
  </g>

  <!-- identity · water -->
  <g transform="translate(232, 270)">
    <rect width="112" height="112" rx="12" fill="#000000" fill-opacity="0.04" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
    <g transform="translate(32, 28) scale(2)" fill="#000000">
      <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm-8 2.75A2.25 2.25 0 1 1 9.75 9 2.25 2.25 0 0 1 12 6.75zM8 17.25v-1.13c0-1.5 2.67-2.25 4-2.25s4 .75 4 2.25v1.13H8z"/>
    </g>
    <text class="label" x="56" y="138" text-anchor="middle">Identity</text>
  </g>

  <!-- negotiate · compute -->
  <g transform="translate(376, 270)">
    <rect width="112" height="112" rx="12" fill="#555555" fill-opacity="0.08" stroke="#555555" stroke-opacity="0.32" stroke-width="2"/>
    <g transform="translate(32, 28) scale(2)" fill="#555555">
      <path d="M21 6h-8.17l-1.24-1.35A1 1 0 0 0 10.83 4H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM8.5 15.5 6 12.25 7.25 11l1.25 1.5L12.25 9 13.5 10.25z"/>
    </g>
    <text class="label" x="56" y="138" text-anchor="middle">Negotiate</text>
  </g>

