  <rect x="88" y="520" width="1024" height="1" fill="#e0e0e0"/>
  <text class="foot" x="88" y="568">400 NEAR contest pool · Qualifying open · lastcradle.io</text>
  <g transform="translate(920, 544)">
    <rect width="192" height="34" rx="4" fill="#ff4500"/>
    <text class="chip" x="96" y="22" text-anchor="middle" fill="#ffffff">ENTER THE ARENA</text>
  </g>
